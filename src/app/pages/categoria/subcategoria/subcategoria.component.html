<app-head></app-head>

<div class="store-container container-fluid my-4 px-md-4">

  <app-filtro
    [filtros]="filtros"
    [proveedores]="proveedores"
    (filtroChange)="filtrarLibros($event)">
  </app-filtro>

  <main class="products-content">
    <div class="card-container">

      <div *ngFor="let libro of datas" class="card">

        <!-- Imagen -->
        <div class="img-wrapper">
          <img [src]="libro.imagen" alt="Libro: {{ libro.titulo }}">
        </div>

        <!-- Cuerpo -->
        <div class="card-body">

          <h5 class="card-title" [title]="libro.titulo">
            {{ libro.titulo }}
          </h5>

          <ng-container *ngIf="libro.precioVenta; else loading">
            <p class="price">S/ {{ libro.precioVenta | number:'1.2-2' }}</p>
          </ng-container>
          <ng-template #loading>
            <div class="placeholder-glow mb-2">
              <span class="placeholder col-8 bg-secondary opacity-25 rounded py-2 d-inline-block"></span>
            </div>
          </ng-template>

          <button
            type="button"
            class="btn-comprar"
            (click)="redireccionarAlDetalleProducto(libro.idLibro)">
            Comprar
          </button>

        </div>
      </div>

    </div>
  </main>

</div>

<app-footer></app-footer>
